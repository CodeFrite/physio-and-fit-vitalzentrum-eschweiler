<style>
/* ============================================================
   Physio & Fit Vitalzentrum Eschweiler
   Design thesis: "Bewegung ist Medizin" — clinical precision,
   delivered calm. Palette drawn from the studio's own rooms
   (forest murals, birch floors, lime machines). Every number on
   the site is set in mono: the dosage thread.
   ============================================================ */

/* ---------- tokens: light (complete palette on bare :root) ---------- */
:root{
  --ground:#EEF1EA;      /* pale birch-green light */
  --ground-2:#E6EBDF;    /* recessed band */
  --raise:#F7F9F4;       /* raised panel */
  --ink:#122019;         /* deep forest-black */
  --night:#122019;       /* fixed dark surface — never flips with the theme */
  --ink-2:#33473C;       /* secondary text */
  --moss:#4F6B57;        /* rules, meta, quiet marks */
  --line:#C9D3C2;        /* hairlines */
  --line-soft:#DCE3D5;
  --puls:#6E960A;        /* the lime, tuned to hold on light ground */
  --puls-on-ink:#A9DC22; /* lime on the dark --ink surface — 10.39:1 */
  --puls-bright:#8FBF12;
  --puls-wash:#E8F0D2;
  --klinik:#1E3D55;      /* brand navy — authority marks only */
  --on-dark:#E9EFE4;
  --scrim:rgba(10,20,15,.62);
  --shadow:0 1px 2px rgba(18,32,25,.05), 0 12px 34px -18px rgba(18,32,25,.30);
  --shadow-lift:0 2px 4px rgba(18,32,25,.06), 0 26px 54px -24px rgba(18,32,25,.38);

  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --pad:clamp(20px,5vw,64px);
  --rail:190px;
  --ease:cubic-bezier(.22,.61,.36,1);

  /* native UI — scrollbars, form controls — must follow the same switch */
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B1310;
    --ground-2:#101A15;
    --raise:#152118;
    --ink:#E4EBDF;
    --ink-2:#B4C4B6;
    --moss:#8FA894;
    --line:#2A3B31;
    --line-soft:#1E2C24;
    --puls:#A9DC22;
    --puls-on-ink:#5C7D08;  /* the --ink surface is near-white here — 3.93:1 */
    --puls-bright:#BEE93F;
    --puls-wash:#1D2A11;
    --klinik:#7FA8C6;
    --on-dark:#E9EFE4;
    --scrim:rgba(4,10,7,.66);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 26px 54px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B1310;
  --ground-2:#101A15;
  --raise:#152118;
  --ink:#E4EBDF;
  --ink-2:#B4C4B6;
  --moss:#8FA894;
  --line:#2A3B31;
  --line-soft:#1E2C24;
  --puls:#A9DC22;
  --puls-on-ink:#5C7D08;  /* the --ink surface is near-white here — 3.93:1 */
  --puls-bright:#BEE93F;
  --puls-wash:#1D2A11;
  --klinik:#7FA8C6;
  --on-dark:#E9EFE4;
  --scrim:rgba(4,10,7,.66);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -18px rgba(0,0,0,.75);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 26px 54px -24px rgba(0,0,0,.85);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--serif);
  font-size:clamp(16.5px,1.02vw,18px);
  line-height:1.62;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}

:where(a,button,summary,input,textarea,[tabindex]):focus-visible{
  outline:2px solid var(--puls);
  outline-offset:3px;
  border-radius:2px;
}

.skip{
  position:absolute; left:-9999px; top:0; z-index:200;
  background:var(--ink); color:var(--ground);
  padding:12px 18px; font-family:var(--mono); font-size:13px;
}
.skip:focus{left:12px; top:12px}

/* ---------- type scale ---------- */
.d1,.d2,.d3{
  font-family:var(--display);
  font-weight:700;
  font-variation-settings:"wdth" 118;
  text-transform:uppercase;
  letter-spacing:-.012em;
  line-height:.92;
  text-wrap:balance;
  margin:0;
}
.d1{font-size:clamp(2.7rem,8.4vw,7rem)}
.d2{font-size:clamp(2rem,4.6vw,3.6rem); line-height:.96}
.phdr h1{font-size:clamp(2.1rem,5.4vw,4.4rem); line-height:.92}
.d3{font-size:clamp(1.35rem,2.3vw,1.95rem); line-height:1.02; font-variation-settings:"wdth" 112}

h4{
  font-family:var(--display); font-weight:600;
  font-variation-settings:"wdth" 110;
  text-transform:uppercase; letter-spacing:.02em;
  font-size:1.02rem; line-height:1.25; margin:0;
}

.lede{
  font-size:clamp(1.15rem,1.65vw,1.42rem);
  line-height:1.5;
  color:var(--ink-2);
  font-weight:300;
  text-wrap:pretty;
}
.measure{max-width:63ch}
.measure-tight{max-width:52ch}

p{margin:0 0 1.05em}
p:last-child{margin-bottom:0}

/* the mono thread: labels, indices, every number */
.label{
  font-family:var(--mono); font-size:11.5px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--moss);
  display:block;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- layout ---------- */
.wrap{max-width:1280px; margin-inline:auto; padding-inline:var(--pad)}
.band{padding-block:clamp(72px,10vw,132px)}
.band--tight{padding-block:clamp(52px,6vw,82px)}
.phdr + .band{padding-top:clamp(22px,3vw,44px)}
.phdr + .bleed + .band{padding-top:clamp(44px,5vw,72px)}
.band--sunk{background:var(--ground-2)}

.hr{height:1px; background:var(--line-soft); border:0; margin:0}

/* two-column: mono rail + prose */
.split{display:grid; grid-template-columns:minmax(0,1fr); gap:clamp(26px,3.4vw,52px)}
/* minmax(0,1fr), not the implicit auto track: an auto track keeps min-width:auto,
   so one over-wide child (the care pathway did exactly this) drags the whole
   page wider than the viewport instead of being made to fit or scroll */
@media (min-width:900px){
  .split{grid-template-columns:var(--rail) minmax(0,1fr); align-items:start}
  .split--wide{grid-template-columns:var(--rail) minmax(0,1fr)}
}
.rail{display:flex; flex-direction:column; gap:10px}
.rail .label{color:var(--moss)}
.rail__note{font-family:var(--mono); font-size:12.5px; line-height:1.55; color:var(--moss)}
@media (min-width:900px){
  .rail{position:sticky; top:112px}
  .rail::before{
    content:""; display:block; width:26px; height:1px;
    background:var(--puls); margin-bottom:14px;
  }
}

.stack{display:flex; flex-direction:column; gap:clamp(20px,2.4vw,32px)}
.stack--lg{gap:clamp(34px,4.4vw,64px)}

/* ---------- spine (left chart rule) ---------- */
.spine{
  position:fixed; left:26px; top:0; bottom:0; width:1px;
  background:var(--line-soft); z-index:40; pointer-events:none;
  display:none;
}
@media (min-width:1180px){.spine{display:block}}
.spine__fill{
  position:absolute; left:0; top:0; width:1px; height:0;
  background:var(--puls); transform-origin:top;
}
.spine__dot{
  position:absolute; left:-3.5px; width:8px; height:8px; border-radius:50%;
  background:var(--puls); top:0;
  box-shadow:0 0 0 0 var(--puls);
  animation:breathe 5.5s var(--ease) infinite;
}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 0 rgba(142,191,18,.45); transform:scale(1)}
  50%{box-shadow:0 0 0 9px rgba(142,191,18,0); transform:scale(.72)}
}
.spine__idx{
  position:fixed; left:26px; bottom:34px;
  font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  color:var(--moss); writing-mode:vertical-rl; text-orientation:mixed;
  transform:rotate(180deg); z-index:40;
  display:none;
}
@media (min-width:1180px){.spine__idx{display:block}}

/* ---------- header ---------- */
.hdr{
  position:fixed; inset:0 0 auto 0; z-index:100;
  background:color-mix(in oklab, var(--ground) 86%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid transparent;
  transition:border-color .35s var(--ease), background .35s var(--ease);
}
.hdr.is-stuck{border-bottom-color:var(--line-soft)}
.hdr__in{
  max-width:1280px; margin-inline:auto; padding:0 var(--pad);
  display:flex; align-items:center; gap:22px;
  height:84px; transition:height .35s var(--ease);
}
.hdr.is-stuck .hdr__in{height:66px}

.brand{display:flex; align-items:center; gap:11px; text-decoration:none; flex:0 0 auto}
.brand svg{width:38px; height:auto; flex:0 0 auto; transition:transform .5s var(--ease)}
.brand:hover svg{transform:scale(1.05)}
.brand__wm{display:flex; flex-direction:column; line-height:1}
.brand__a{
  font-family:var(--display); font-weight:700; font-variation-settings:"wdth" 105;
  font-size:17px; letter-spacing:-.015em; color:var(--ink);
}
.brand__a em{font-style:normal; color:var(--puls)}
.brand__b{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.17em;
  text-transform:uppercase; color:var(--moss); margin-top:4px;
}

.nav{display:none; margin-left:auto; align-items:center; gap:0}
@media (min-width:1060px){.nav{display:flex}}
.nav a,.nav button{
  font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 108;
  text-transform:uppercase; font-size:12.5px; letter-spacing:.055em;
  background:none; border:0; cursor:pointer; text-decoration:none;
  padding:9px 10px; border-radius:3px; position:relative; color:var(--ink);
  transition:color .25s var(--ease);
}
.nav a::after{
  content:""; position:absolute; left:10px; right:10px; bottom:4px; height:1px;
  background:var(--puls); transform:scaleX(0); transform-origin:left;
  transition:transform .38s var(--ease);
}
.nav a:hover::after,.nav a.is-on::after{transform:scaleX(1)}
.nav a.is-on{color:var(--puls)}
.nav .drop__btn.is-on{color:var(--puls)}

.drop{position:relative}
.drop__btn{display:flex; align-items:center; gap:7px}
.drop__btn svg{width:9px; height:9px; transition:transform .3s var(--ease)}
.drop[data-open="true"] .drop__btn svg{transform:rotate(180deg)}
.drop__menu{
  position:absolute; top:calc(100% + 10px); left:0; min-width:255px;
  background:var(--raise); border:1px solid var(--line-soft); border-radius:4px;
  box-shadow:var(--shadow-lift); padding:8px;
  display:flex; flex-direction:column; gap:1px;
  opacity:0; visibility:hidden; transform:translateY(-7px);
  transition:opacity .26s var(--ease), transform .26s var(--ease), visibility .26s;
}
.drop[data-open="true"] .drop__menu{opacity:1; visibility:visible; transform:none}
.drop__menu a{
  padding:10px 12px; border-radius:3px; letter-spacing:.04em;
  display:flex; align-items:baseline; gap:11px;
}
.drop__menu a::after{display:none}
.drop__menu a:hover{background:var(--puls-wash); color:var(--puls)}
.drop__menu a.is-on{background:var(--puls-wash)}
.drop__menu .num{font-size:10px; color:var(--moss); letter-spacing:.1em}

.hdr__cta{margin-left:8px}
@media (max-width:1059px){.hdr__cta{margin-left:auto}}

.burger{
  display:grid; place-items:center; width:44px; height:44px;
  background:none; border:1px solid var(--line); border-radius:3px; cursor:pointer;
  margin-left:10px;
}
@media (min-width:1060px){.burger{display:none}}
.burger span{display:block; width:18px; height:1.5px; background:var(--ink); transition:transform .3s var(--ease), opacity .2s}
.burger span+span{margin-top:5px}
body.menu-open .burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* ---------- mobile overlay menu ---------- */
.sheet{
  position:fixed; inset:0; z-index:90; background:var(--ground);
  padding:104px var(--pad) 40px; overflow-y:auto;
  opacity:0; visibility:hidden; transform:translateY(-10px);
  transition:opacity .34s var(--ease), transform .34s var(--ease), visibility .34s;
}
body.menu-open .sheet{opacity:1; visibility:visible; transform:none}
.sheet__grp{border-top:1px solid var(--line-soft); padding-block:22px}
.sheet__grp .label{margin-bottom:12px}
.sheet__grp a{
  display:block; text-decoration:none; padding:7px 0;
  font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 112;
  text-transform:uppercase; letter-spacing:.01em; font-size:clamp(1.25rem,5.4vw,1.7rem);
  line-height:1.16; color:var(--ink); transition:color .2s var(--ease), transform .3s var(--ease);
}
.sheet__grp a:hover,.sheet__grp a.is-on{color:var(--puls); transform:translateX(5px)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:11px;
  font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 108;
  text-transform:uppercase; font-size:12.5px; letter-spacing:.07em;
  padding:13px 21px; border-radius:3px; text-decoration:none; cursor:pointer;
  border:1px solid var(--ink); background:var(--ink); color:var(--ground);
  transition:background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
}
.btn:hover{background:var(--puls); border-color:var(--puls); color:#0B1310; transform:translateY(-1px)}
.btn__arw{transition:transform .35s var(--ease)}
.btn:hover .btn__arw{transform:translateX(4px)}
.btn--ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn--ghost:hover{background:transparent; border-color:var(--puls); color:var(--puls)}
.btn--light{background:var(--on-dark); border-color:var(--on-dark); color:#0B1310}
.btn--light:hover{background:var(--puls-bright); border-color:var(--puls-bright)}
.btn--sm{padding:10px 16px; font-size:11.5px}

/* inline text link */
.tlink{
  color:var(--ink); text-decoration:none; position:relative;
  background-image:linear-gradient(var(--puls),var(--puls));
  background-size:100% 1px; background-repeat:no-repeat; background-position:0 100%;
  padding-bottom:1px; transition:color .25s var(--ease), background-size .35s var(--ease);
}
.tlink:hover{color:var(--puls)}
a[href^="http"].tlink,a[href^="mailto"].tlink,a[href^="tel"].tlink{word-break:break-word}

/* ---------- hero ---------- */
.hero{
  position:relative; min-height:min(100svh,940px);
  display:flex; align-items:flex-end;
  background:#0B1310; overflow:hidden; isolation:isolate;
}
.hero__bg{position:absolute; inset:0; z-index:0; overflow:hidden}
.hero__bg img{
  width:100%; height:100%; object-fit:cover; object-position:50% 42%;
  transform:scale(1.08); animation:drift 26s ease-in-out infinite alternate;
  filter:saturate(.86) contrast(1.02);
}
@keyframes drift{from{transform:scale(1.08) translate3d(0,0,0)} to{transform:scale(1.15) translate3d(-1.4%,-1.6%,0)}}
.hero__scrim{
  position:absolute; inset:0; z-index:1;
  background:
    linear-gradient(180deg, rgba(8,16,12,.72) 0%, rgba(8,16,12,.32) 34%, rgba(8,16,12,.80) 82%, rgba(8,16,12,.94) 100%),
    radial-gradient(90% 70% at 78% 34%, rgba(142,191,18,.14) 0%, transparent 62%);
}
.hero__in{position:relative; z-index:3; width:100%; padding-block:clamp(48px,9vw,110px) clamp(40px,6vw,68px)}
.hero__eyebrow{color:rgba(233,239,228,.72); margin-bottom:clamp(20px,3vw,34px)}
.hero__ttl{color:var(--on-dark); font-variation-settings:"wdth" 122}
.hero__ttl .ln{display:block; overflow:hidden}
.hero__ttl .ln > span{display:block; transform:translateY(105%); opacity:0}
.is-lit .hero__ttl .ln > span{animation:riseIn 1.05s var(--ease) forwards}
.is-lit .hero__ttl .ln:nth-child(1) > span{animation-delay:.10s}
.is-lit .hero__ttl .ln:nth-child(2) > span{animation-delay:.20s}
@keyframes riseIn{to{transform:none; opacity:1}}
.hero__ttl em{font-style:normal; color:var(--puls-bright)}

.hero__foot{
  margin-top:clamp(30px,4.6vw,58px);
  display:grid; gap:clamp(22px,3vw,40px);
  align-items:end;
  opacity:0; transform:translateY(16px);
}
.is-lit .hero__foot{animation:riseSoft .9s var(--ease) .58s forwards}
@keyframes riseSoft{to{opacity:1; transform:none}}
@media (min-width:860px){.hero__foot{grid-template-columns:minmax(0,1fr) auto}}
.hero__claim{
  color:rgba(233,239,228,.9); font-weight:300; max-width:46ch;
  font-size:clamp(1.05rem,1.5vw,1.3rem); line-height:1.5;
}
.hero__acts{display:flex; flex-wrap:wrap; gap:12px}

/* the Zirkel: one revolution every 11 seconds — the Milon round */
.zirkel{
  position:absolute; z-index:2; pointer-events:none;
  right:clamp(-70px,-2vw,0px); top:clamp(64px,12vh,150px);
  width:clamp(230px,32vw,430px); aspect-ratio:1;
  opacity:0; animation:fadeZ 2s var(--ease) .5s forwards;
}
@keyframes fadeZ{to{opacity:1}}
.zirkel svg{width:100%; height:100%; overflow:visible}
.zirkel__ring{fill:none; stroke:rgba(233,239,228,.16); stroke-width:1}
.zirkel__arc{
  fill:none; stroke:var(--puls-bright); stroke-width:1.5; stroke-linecap:round;
  stroke-dasharray:70 1000; transform-origin:50% 50%;
  animation:spin11 11s linear infinite;
}
.zirkel__tick{stroke:rgba(233,239,228,.22); stroke-width:1}
@keyframes spin11{to{transform:rotate(360deg)}}

.scrollcue{
  position:absolute; left:var(--pad); bottom:22px; z-index:3;
  display:none; align-items:center; gap:10px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:rgba(233,239,228,.55);
}
@media (min-height:700px) and (min-width:860px){.scrollcue{display:flex}}
.scrollcue i{display:block; width:34px; height:1px; background:rgba(233,239,228,.4); position:relative; overflow:hidden}
.scrollcue i::after{content:""; position:absolute; inset:0; background:var(--puls-bright); animation:sweep 2.8s var(--ease) infinite}
@keyframes sweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

/* ---------- reveal ---------- */
.rv{opacity:0; transform:translateY(20px); transition:opacity .9s var(--ease), transform .9s var(--ease)}
.rv.in{opacity:1; transform:none}

/* ---------- cards ---------- */
.grid{display:grid; gap:1px; background:var(--line-soft); border-block:1px solid var(--line-soft)}
@media (min-width:700px){.grid--2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid--3{grid-template-columns:repeat(3,1fr)}}
@media (min-width:700px) and (max-width:979px){.grid--3{grid-template-columns:repeat(2,1fr)}}

.cell{
  background:var(--ground); padding:clamp(26px,3vw,40px);
  display:flex; flex-direction:column; gap:14px;
  position:relative; transition:background .4s var(--ease);
}
.cell::before{
  content:""; position:absolute; left:0; top:0; width:2px; height:0;
  background:var(--puls); transition:height .5s var(--ease);
}
a.cell{text-decoration:none}
a.cell:hover{background:var(--raise)}
a.cell:hover::before{height:100%}
.cell__idx{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--moss)}
.cell p{color:var(--ink-2); font-size:.97rem}
.cell__go{
  margin-top:auto; padding-top:6px;
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--puls); display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px;
}
.cell__go svg{transition:transform .35s var(--ease)}
a.cell:hover .cell__go svg{transform:translateX(4px)}

/* panel (bordered box) */
.panel{
  background:var(--raise); border:1px solid var(--line-soft); border-radius:4px;
  padding:clamp(24px,2.8vw,38px); display:flex; flex-direction:column; gap:16px;
}
.panel--flat{background:transparent}

/* ---------- lists ---------- */
.ticks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
.ticks li{position:relative; padding-left:26px; color:var(--ink-2)}
.ticks li::before{
  content:""; position:absolute; left:0; top:.62em; width:12px; height:1px; background:var(--puls);
}
.ticks--tight li{padding-left:22px}

.defs{display:flex; flex-direction:column; gap:0; margin:0}
.defs > div{
  display:grid; gap:6px 26px; padding-block:18px;
  border-top:1px solid var(--line-soft);
}
.defs > div:last-child{border-bottom:1px solid var(--line-soft)}
@media (min-width:760px){.defs > div{grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr)}}
.defs dt{font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 110; text-transform:uppercase; font-size:.9rem; letter-spacing:.03em}
.defs dd{margin:0; color:var(--ink-2); font-size:.97rem}

/* ---------- figures ---------- */
.fig{position:relative; overflow:hidden; border-radius:4px; background:var(--ground-2)}
.fig img{width:100%; height:100%; object-fit:cover; transition:transform 1.2s var(--ease)}
.fig--tall{aspect-ratio:3/4}
.fig--wide{aspect-ratio:16/10}
.fig--sq{aspect-ratio:1}
.fig figcaption{
  position:absolute; left:0; bottom:0; right:0; padding:14px 16px;
  background:linear-gradient(to top, rgba(8,16,12,.82), transparent);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:rgba(233,239,228,.88);
}

/* full-bleed image band with parallax */
.bleed{position:relative; height:clamp(320px,52vw,620px); overflow:hidden; background:#0B1310}
.bleed img{
  position:absolute; inset:-14% 0; width:100%; height:128%;
  object-fit:cover; will-change:transform;
}
.bleed__ov{position:absolute; inset:0; background:var(--scrim); display:flex; align-items:center}
.bleed .d2,.bleed .lede,.bleed .label{color:var(--on-dark)}
.bleed .lede{color:rgba(233,239,228,.82)}
.bleed .label{color:rgba(233,239,228,.6)}

/* ---------- opening hours ---------- */
.hours{display:grid; gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden}
@media (min-width:820px){.hours{grid-template-columns:repeat(7,1fr)}}
.day{background:var(--raise); padding:18px 16px 20px; display:flex; flex-direction:column; gap:12px}
.day--now{box-shadow:inset 0 2px 0 var(--puls)}
.day__n{
  font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 108;
  text-transform:uppercase; font-size:.82rem; letter-spacing:.08em;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding-bottom:11px; border-bottom:1px solid var(--line-soft);
}
.day--now .day__n{color:var(--puls)}
.day__slots{display:flex; flex-direction:column; gap:9px}
.slot{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:12.5px; line-height:1.5; padding:9px 8px; border-radius:3px; text-align:center;
  background:var(--puls-wash); color:var(--ink);
  border-left:2px solid var(--puls);
}
.slot .num{white-space:nowrap}
.slot--none{background:transparent; border-left-color:var(--line); color:var(--moss)}
.hours__note{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--on-dark); background:var(--klinik); padding:14px 18px; border-radius:3px;
  text-align:center; line-height:1.7;
}
:root[data-theme="dark"] .hours__note,
:root:not([data-theme="light"]) .hours__note{color:#0B1310}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .hours__note{color:var(--on-dark)}}
.legend{display:flex; flex-wrap:wrap; gap:20px; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--moss)}
.legend span{display:flex; align-items:center; gap:9px}
.legend i{width:22px; height:10px; border-radius:2px; display:block}

/* ---------- schedule ---------- */
.sched{display:grid; gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden}
@media (min-width:760px){.sched{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1080px){.sched{grid-template-columns:repeat(3,1fr)}}
.sched__day{background:var(--raise); padding:22px}
.sched__day h4{margin-bottom:16px; color:var(--puls)}
.sched__row{
  display:flex; gap:14px; align-items:baseline; padding-block:9px;
  border-top:1px solid var(--line-soft);
}
.sched__row:first-of-type{border-top:0}
.sched__t{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--moss); flex:0 0 auto; min-width:74px}
.sched__k{
  font-family:var(--display); font-weight:600; font-variation-settings:"wdth" 106;
  text-transform:uppercase; font-size:.82rem; letter-spacing:.045em; line-height:1.35;
}
.sched__none{
  grid-column:1/-1; background:var(--raise); padding:22px;
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--moss);
}

/* ---------- pricing ---------- */
.tiers{display:grid; gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden}
@media (min-width:760px){.tiers{grid-template-columns:repeat(3,1fr)}}
.tier{background:var(--raise); padding:clamp(24px,2.6vw,34px); display:flex; flex-direction:column; gap:14px}
.tier__term{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--moss)}
.tier__price{
  font-family:var(--display); font-weight:700; font-variation-settings:"wdth" 118;
  font-size:clamp(1.9rem,3.4vw,2.7rem); line-height:1; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.tier__price small{font-size:.42em; font-weight:600; letter-spacing:.04em; color:var(--moss); margin-left:6px}
.tier p{font-size:.9rem; color:var(--ink-2); margin:0}
.tier__flag{
  align-self:flex-start; font-family:var(--mono); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--puls); background:var(--puls-wash);
  padding:5px 9px; border-radius:2px;
}

/* ---------- steps (real sequence: 1. 2. 3. Schritt) ---------- */
.steps{display:grid; gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:4px; overflow:hidden}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--raise); padding:clamp(22px,2.4vw,32px); display:flex; flex-direction:column; gap:12px}
.step__n{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--puls);
  display:flex; align-items:center; gap:10px;
}
.step__n i{flex:1; height:1px; background:var(--line-soft); display:block}
.step p{font-size:.97rem; color:var(--ink-2)}

/* ---------- contact / footer ---------- */
.form{display:flex; flex-direction:column; gap:18px}
.field{display:flex; flex-direction:column; gap:8px}
.field label{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--moss)}
.field input,.field textarea{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:var(--ground); border:1px solid var(--line); border-radius:3px;
  padding:13px 14px; transition:border-color .3s var(--ease), background .3s var(--ease);
}
.field input:focus,.field textarea:focus{border-color:var(--puls); background:var(--raise)}
.form__note{font-family:var(--mono); font-size:11px; line-height:1.7; color:var(--moss)}

.ftr{
  background:var(--night); color:var(--on-dark);
  border-top:1px solid rgba(233,239,228,.10);
  padding-block:clamp(46px,5.5vw,68px) 26px; margin-top:0;
}
.ftr a{color:var(--on-dark)}
.ftr .label{color:rgba(233,239,228,.62)}
.ftr__top{display:grid; gap:clamp(30px,3.2vw,44px); align-items:start}
@media (min-width:620px){.ftr__top{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.ftr__top{grid-template-columns:1.15fr .85fr .85fr .85fr}}
.ftr__nav{display:flex; flex-direction:column; gap:9px}
.ftr__nav a{text-decoration:none; font-size:.95rem; color:rgba(233,239,228,.88); transition:color .25s var(--ease), transform .25s var(--ease)}
.ftr__nav a:hover{color:var(--puls-bright); transform:translateX(3px)}
.ftr__bar{
  margin-top:clamp(30px,3.5vw,44px); padding-top:22px;
  border-top:1px solid rgba(233,239,228,.2);
  display:flex; flex-wrap:wrap; gap:14px 26px; justify-content:space-between;
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:rgba(233,239,228,.62);
}
.ftr__bar a{text-decoration:none}
.ftr__bar a:hover{color:var(--puls-bright)}
.ftr__brand .brand__a{color:var(--on-dark)}
.ftr__brand .brand__b{color:rgba(233,239,228,.62)}

.partners{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.partner{
  display:block; background:#fff; border-radius:3px; padding:0; overflow:hidden;
  width:clamp(140px,17vw,178px); border:1px solid var(--line-soft);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.partner:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.partner img{width:100%; height:auto}

/* ---------- legal / long-form ---------- */
.legal{max-width:74ch}
.legal h3{
  font-family:var(--display); font-weight:700; font-variation-settings:"wdth" 112;
  text-transform:uppercase; font-size:1.15rem; letter-spacing:-.005em; line-height:1.2;
  margin:2.4em 0 .7em; padding-top:1.3em; border-top:1px solid var(--line-soft);
  display:flex; gap:14px; align-items:baseline;
}
.legal h3:first-child{margin-top:0; padding-top:0; border-top:0}
.legal h4{margin:1.9em 0 .5em; color:var(--moss); letter-spacing:.03em; display:flex; gap:12px; align-items:baseline}
.legal h5{
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--moss); margin:1.6em 0 .5em; font-weight:500;
}
.legal .sn{font-family:var(--mono); font-size:.72em; color:var(--puls); letter-spacing:.06em; flex:0 0 auto}
.legal p{font-size:.97rem; color:var(--ink-2)}
.legal ul{margin:0 0 1.05em; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:7px}
.legal ul li{position:relative; padding-left:22px; font-size:.97rem; color:var(--ink-2)}
.legal ul li::before{content:""; position:absolute; left:0; top:.62em; width:10px; height:1px; background:var(--puls)}
.legal a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; word-break:break-word}
.legal a:hover{color:var(--puls); text-decoration-color:var(--puls)}

/* ---------- page routing ---------- */
.page{display:none}
.page.is-live{display:block; animation:pageIn .5s var(--ease)}
@keyframes pageIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

.phdr{padding-block:clamp(112px,12vw,168px) clamp(30px,4vw,52px); position:relative}
.phdr__k{color:var(--moss); margin-bottom:18px}
.crumb{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--moss); margin-bottom:20px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--puls)}

/* utility */
.mono-i{font-family:var(--mono); font-variant-numeric:tabular-nums}
.tocenter{display:flex; flex-direction:column; align-items:flex-start; gap:20px}
.row{display:flex; flex-wrap:wrap; gap:12px}
.eyebrow-rule{display:flex; align-items:center; gap:16px}
.eyebrow-rule i{flex:1; height:1px; background:var(--line-soft); display:block; max-width:180px}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important; scroll-behavior:auto !important;
  }
  .rv{opacity:1; transform:none}
  .hero__ttl .ln > span{transform:none; opacity:1}
  .hero__foot{opacity:1; transform:none}
  .zirkel{opacity:1}
  .bleed img{transform:none !important}
}

/* ---------- brand mark colour ---------- */
.brand svg{color:var(--ink)}
.ftr__brand svg{color:var(--on-dark)}

/* ---------- the dosage thread: figures inside prose ---------- */
.numhit{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:.94em; font-weight:500; letter-spacing:-.01em; color:var(--puls);
  white-space:nowrap;
}

/* ---------- nav breakpoint ---------- */
@media (min-width:1060px) and (max-width:1119px){.nav{display:none}}

/* the live "open now" mark rides inside the Kontakt button rather than in a
   chip of its own — one control, one destination, and the signal survives at
   every width instead of vanishing with the desktop nav */
.hdr__cta{gap:9px}
.btn__dot{
  width:7px; height:7px; border-radius:50%; display:block; flex:0 0 auto;
  background:currentColor; opacity:.45;
  transition:background .3s var(--ease), opacity .3s var(--ease);
}
.hdr__cta.is-open .btn__dot{background:var(--puls-on-ink); opacity:1; animation:breathe 5.5s var(--ease) infinite}
/* on hover the button ground turns lime, so the mark takes the hover ink */
.hdr__cta:hover.is-open .btn__dot{background:#0B1310}

/* label kept for assistive tech only — the dot alone carries no state aloud */
.vh{
  position:absolute; width:1px; height:1px; margin:-1px; padding:0;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
}
@media (max-width:1119px){.nav{display:none} .hdr__cta{margin-left:auto}}
@media (min-width:1120px){.nav{display:flex} .burger{display:none}}

.livenow{
  display:flex; align-items:center; gap:11px; margin:0;
  font-family:var(--mono); font-size:12.5px; letter-spacing:.03em; color:var(--ink-2);
}
.livenow__dot{width:8px; height:8px; border-radius:50%; background:var(--line); flex:0 0 auto; display:block}
.livenow__dot.is-open{background:var(--puls); animation:breathe 5.5s var(--ease) infinite}

/* ---------- home: studio block two columns ---------- */
@media (min-width:900px){
  [data-cols]{grid-template-columns:1.1fr .9fr; align-items:center}
}

/* ---------- milon dial ---------- */
.dial{width:82px; margin-top:6px}
.dial svg{width:100%; height:auto; overflow:visible}
.dial__bg{fill:none; stroke:var(--line); stroke-width:1}
.dial__arc{
  fill:none; stroke:var(--puls); stroke-width:2; stroke-linecap:round;
  stroke-dasharray:52 314; transform-origin:50% 50%;
  animation:spin11 11s linear infinite;
}

/* ---------- accordion ---------- */
.acc{display:flex; flex-direction:column; border-top:1px solid var(--line-soft)}
.acc__i{border-bottom:1px solid var(--line-soft)}
.acc__i summary{
  list-style:none; cursor:pointer; padding:22px 0;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  transition:color .25s var(--ease);
}
.acc__i summary::-webkit-details-marker{display:none}
.acc__i summary:hover{color:var(--puls)}
.acc__k{
  font-family:var(--display); font-weight:700; font-variation-settings:"wdth" 114;
  text-transform:uppercase; letter-spacing:-.005em; line-height:1;
  font-size:clamp(1.3rem,2.6vw,2rem);
}
.acc__s{position:relative; width:16px; height:16px; flex:0 0 auto}
.acc__s::before,.acc__s::after{
  content:""; position:absolute; left:0; top:7.5px; width:16px; height:1.5px;
  background:var(--puls); transition:transform .35s var(--ease);
}
.acc__s::after{transform:rotate(90deg)}
.acc__i[open] .acc__s::after{transform:rotate(0deg)}
.acc__i[open] .acc__k{color:var(--puls)}
.acc__b{
  padding:2px 0 30px; display:flex; flex-direction:column; gap:16px; max-width:70ch;
  animation:accIn .45s var(--ease);
}
@keyframes accIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
.acc__cols{display:grid; gap:clamp(18px,2.4vw,34px)}
@media (min-width:720px){.acc__cols{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.acc__cols h4{margin-bottom:11px}
.acc__out{color:var(--puls); font-size:1.02rem}
.acc__b .lede{font-size:1.1rem}

/* ---------- schedule: weekend note ---------- */
.sched__off{
  font-family:var(--mono); font-size:12px; line-height:1.65; letter-spacing:.06em;
  text-transform:uppercase; color:var(--moss); margin:0;
}

/* ---------- opening hours ---------- */
.day__tag{color:var(--puls); font-size:11px; line-height:1}
.gap{
  display:block; height:26px; border-radius:2px;
  background:repeating-linear-gradient(135deg, var(--klinik) 0 5px, transparent 5px 10px);
  opacity:.55;
}
.gap--long{height:46px}
.legend__gap{
  background:repeating-linear-gradient(135deg, var(--klinik) 0 5px, transparent 5px 10px);
  opacity:.55;
}
.legend span{max-width:100%}
@media (max-width:819px){
  .day{flex-direction:row; align-items:flex-start; gap:18px}
  .day__n{flex:0 0 108px; border-bottom:0; padding-bottom:0; display:block}
  .day__slots{flex:1; flex-direction:column; align-items:stretch; gap:8px}
  .slot{text-align:left; padding:9px 12px}
  .gap{width:100%; height:12px}
  .gap--long{width:100%; height:12px}
}

/* ---------- kontakt ---------- */
.kontakt{display:grid; gap:clamp(24px,3vw,44px); align-items:start}
@media (min-width:900px){.kontakt{grid-template-columns:1.05fr .95fr}}
.addr{font-style:normal; line-height:1.7; margin:0}
.contactline{
  display:inline-flex; align-items:center; gap:10px; text-decoration:none;
  color:var(--ink); font-size:.96rem; transition:color .25s var(--ease);
  word-break:break-word;
}
.contactline svg{flex:0 0 auto; color:var(--puls)}
.contactline:hover{color:var(--puls)}
.ftr .contactline{color:rgba(233,239,228,.88)}
.ftr .contactline:hover{color:var(--puls-bright)}

/* ---------- datenschutz table of contents ---------- */
.toc{display:none; flex-direction:column; gap:7px; margin-top:14px; max-height:60vh; overflow-y:auto}
@media (min-width:900px){.toc{display:flex}}
.toc a{
  font-family:var(--mono); font-size:11px; line-height:1.5; letter-spacing:.03em;
  color:var(--moss); text-decoration:none; padding:3px 0;
  transition:color .25s var(--ease), transform .25s var(--ease);
}
.toc a:hover{color:var(--puls); transform:translateX(3px)}

/* ---------- misc ---------- */
.sched__k em{font-style:normal; color:var(--moss); font-weight:400; text-transform:none; letter-spacing:0}

.rail:empty{display:none}
@media (min-width:900px){.rail:empty{display:block}}

@media (min-width:1060px) and (max-width:1119px){.burger{display:grid}}

/* ---------- cookie notice ---------- */
.cookie{
  position:fixed; left:0; right:0; bottom:0; z-index:120;
  background:var(--raise); border-top:1px solid var(--line);
  box-shadow:0 -18px 44px -28px rgba(18,32,25,.5);
  transform:translateY(102%); transition:transform .5s var(--ease);
}
.cookie.is-up{transform:none}
.cookie[hidden]{display:none}
.cookie__in{
  max-width:1280px; margin-inline:auto; padding:20px var(--pad);
  display:grid; gap:16px 34px; align-items:center;
}
@media (min-width:820px){.cookie__in{grid-template-columns:minmax(0,1fr) auto}}
.cookie__txt h4{margin-bottom:7px}
.cookie__txt p{font-size:.9rem; color:var(--ink-2); max-width:78ch; margin:0}
.cookie__acts{display:flex; gap:10px; flex-wrap:wrap}

.sched__bar{font-family:var(--mono); font-size:12px; color:var(--line); flex:0 0 auto}

/* ---------- narrow phones: the header must always fit the menu button ---------- */
.brand{min-width:0}
.brand__wm{overflow:hidden}
.burger{flex:0 0 auto}
@media (max-width:640px){
  .hdr__in{gap:12px}
  .brand svg{width:32px}
  .brand__b{display:none}
  .brand__a{font-size:16px}
}
@media (max-width:400px){
  .hdr__cta{display:none}   /* Kontakt is in the menu */
}

/* German compounds are long and often unbreakable — let them hyphenate rather than overflow */
.d1,.d2,.d3,.acc__k,h4{overflow-wrap:break-word}
.d2,.d3,.acc__k,.phdr h1{hyphens:auto; -webkit-hyphens:auto}
.tier__term,.sched__k,.day__n{overflow-wrap:break-word}

/* ==========================================================================
   merged pages — an absorbed page becomes an anchored section of its new home
   ========================================================================== */
.pgsec{scroll-margin-top:96px; position:relative}
.pgsec::before{
  content:""; display:block; height:1px; background:var(--line-soft);
  margin:clamp(22px,3vw,40px) var(--pad) 0;
}
.pgsec .phdr{padding-block:clamp(26px,3.4vw,44px) 0}
.pgsec .phdr h2.d2{font-size:clamp(28px,4vw,46px)}
.pgsec:target::before,.pgsec.is-flash::before{background:var(--puls); height:2px}

/* ==========================================================================
   interactive modules
   ========================================================================== */
.mod{border:1px solid var(--line); border-radius:5px; overflow:hidden; background:var(--raise)}
.mod__bar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:var(--ground-2); border-bottom:1px solid var(--line-soft);
}
.mod__bar h3{
  font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  font-weight:500; color:var(--ink); margin:0;
}
.mod__flag{font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--moss)}
.mod__body{padding:clamp(16px,2.5vw,26px)}
.mod__ctl{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px}
.mod__chip{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:7px 13px;
  border:1px solid var(--line); border-radius:2px; background:transparent; color:var(--moss);
  cursor:pointer; transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.mod__chip:hover{color:var(--ink); border-color:var(--moss)}
.mod__chip.is-on{background:var(--ink); border-color:var(--ink); color:var(--ground)}
.mod__out{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:14px 20px}
.mod__out div span{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--moss); margin-bottom:3px}
.mod__out div b{font-family:var(--mono); font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.mod__note{font-size:15px; color:var(--ink-2); border-left:2px solid var(--puls); padding-left:15px; margin:18px 0 0}

/* dosage ring */
.dose{display:grid; gap:26px; align-items:center}
@media (min-width:640px){.dose{grid-template-columns:230px minmax(0,1fr)}}
.dose svg{width:100%; max-width:230px; height:auto; display:block; margin-inline:auto}
.dose__seg{cursor:pointer}
.dose__seg:hover .dose__arc{stroke:var(--puls-bright)}
.dose__arc{fill:none; stroke-width:13; transition:stroke .2s var(--ease)}
.dose__hit{fill:none; stroke:transparent; stroke-width:26}
.dose__hub{font-family:var(--mono); font-size:11px; fill:var(--moss); text-anchor:middle}
.dose__big{font-family:var(--mono); font-size:25px; font-weight:500; fill:var(--ink); text-anchor:middle}
.dose__mark{transform-origin:120px 120px; animation:zspin 11s linear infinite}
@keyframes zspin{to{transform:rotate(360deg)}}
.dose__card{background:var(--ground-2); border-radius:3px; padding:13px 15px; margin-bottom:16px; min-height:84px}
.dose__card b{display:block; font-weight:600; font-size:15px; margin-bottom:3px}
.dose__card p{font-size:14.5px; margin:0; color:var(--ink-2)}

/* floor plan */
.plan{display:grid; gap:22px}
@media (min-width:820px){.plan{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
.plan svg{width:100%; height:auto; display:block; border-radius:3px}
.zone{cursor:pointer}
.zone rect{transition:fill .22s var(--ease), stroke .22s var(--ease)}
.zone:hover rect{stroke:var(--puls); stroke-width:2}
.zone.is-on rect{fill:var(--puls-wash); stroke:var(--puls); stroke-width:2}
.zone text{font-family:var(--mono); font-size:9px; letter-spacing:.05em; fill:var(--moss); pointer-events:none}
.zone.is-on text{fill:var(--puls)}
.plan__info{background:var(--ground-2); border-radius:3px; padding:17px 19px; align-self:start}
.plan__info h4{font-size:19px; margin:0 0 9px}
.plan__info ul{font-size:14.5px; margin:0; padding-left:1.1em; color:var(--ink-2)}
.plan__info li{margin-bottom:.3em}

/* rehasport dosage */
.reha__dots{display:flex; flex-wrap:wrap; gap:3px; margin:16px 0 18px}
.reha__dot{width:13px; height:13px; border-radius:1px; background:var(--line)}
.reha__dot.is-used{background:var(--puls)}
.mod input[type=range]{width:100%; max-width:300px; accent-color:var(--puls)}
.mod__field{display:flex; flex-direction:column; gap:5px; font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--moss)}
.mod__field input[type=date]{
  font-family:var(--mono); font-size:13px; padding:8px 10px; border:1px solid var(--line);
  border-radius:2px; background:var(--ground); color:var(--ink); color-scheme:light dark;
}

/* weekly course grid */
.kw{overflow-x:auto}
.kgrid{display:grid; grid-template-columns:repeat(7,minmax(112px,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:3px; min-width:790px}
.kcol{background:var(--ground); padding:10px 9px; display:flex; flex-direction:column; gap:6px}
.kcol__d{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--moss); margin-bottom:3px}
.kcol.is-today{background:var(--puls-wash)}
.kslot{
  border-left:2px solid var(--puls); padding:5px 0 5px 8px; font-size:13.5px; line-height:1.35;
  overflow-wrap:anywhere; hyphens:auto; transition:opacity .2s var(--ease);
}
.kslot time{display:block; font-family:var(--mono); font-size:11px; color:var(--moss); font-variant-numeric:tabular-nums}
.kslot.is-dim{opacity:.2}
.kcol__none{font-family:var(--mono); font-size:11px; color:var(--moss); padding:5px 0}

/* membership calculator */
.mcalc{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.mcard{border:1px solid var(--line-soft); border-radius:3px; padding:15px 17px; background:var(--ground)}
.mcard.is-best{border-color:var(--puls); box-shadow:inset 0 0 0 1px var(--puls)}
.mcard h4{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); margin:0 0 11px}
.mrow{display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:5px 0; border-bottom:1px dotted var(--line-soft)}
.mrow:last-of-type{border-bottom:0}
.mrow span{color:var(--moss)}
.mrow b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}
.mrow--tot{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); border-bottom:0}
.mrow--tot b{font-size:19px; color:var(--puls)}

/* care pathway */
/* ==========================================================================
   The care pathway. Vertical by default — five steps stacked, their bars
   joining into one continuous rule, which is the same treatment-chart spine
   the rest of the page is built on and the only shape that fits a phone.

   The horizontal row is opted into by CONTAINER width, not viewport width,
   because this module's column is not monotonic in the viewport: at 1000px
   the rail takes 190px and leaves it 674, at 860px the rail is gone and it
   gets 772. No single media query can say "does the row fit". A browser
   without container queries simply keeps the vertical list, which is fine.
   ========================================================================== */
.mod__body--path{container-type:inline-size}
.path{margin-bottom:16px}
.pstep{
  display:grid; grid-template-columns:4px 1fr; column-gap:14px; width:100%;
  text-align:left; background:transparent; border:0; cursor:pointer; padding:0;
}
.pstep__bar{
  display:block;   /* a <span> stays inline once .pstep is no longer a grid */
  grid-column:1; grid-row:1 / 3; align-self:stretch; width:4px;
  background:var(--line); transition:background .22s var(--ease);
}
.pstep:first-child .pstep__bar{border-radius:2px 2px 0 0}
.pstep:last-child .pstep__bar{border-radius:0 0 2px 2px}
.pstep.is-on .pstep__bar,.pstep:hover .pstep__bar{background:var(--puls)}
.pstep__n{
  grid-column:2; grid-row:1; display:block; padding-top:11px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--moss);
}
.pstep__t{
  grid-column:2; grid-row:2; display:block; padding-bottom:11px;
  font-size:15px; font-weight:600; color:var(--ink); line-height:1.25;
}
.pstep.is-on .pstep__t{color:var(--puls)}

/* 700px of CONTENT box (the query ignores .mod__body's padding): five steps at
   their 138px minimum need 690, so this keeps the row everywhere it ever fitted */
@container (min-width:700px){
  .path{display:flex; gap:0; overflow-x:auto; padding-bottom:6px; margin-bottom:18px}
  .pstep{display:block; flex:1 0 138px; padding:0 12px 0 0}
  .pstep__bar{width:auto; height:4px; margin-bottom:10px; border-radius:2px}
  .pstep:first-child .pstep__bar,.pstep:last-child .pstep__bar{border-radius:2px}
  .pstep__n{padding-top:0; margin-bottom:3px}
  .pstep__t{padding-bottom:0; font-size:14.5px}
}
.pinfo{background:var(--ground-2); border-radius:3px; padding:17px 19px}
.pinfo h4{font-size:19px; margin:0 0 8px}
.pinfo p{font-size:15px; margin:0 0 12px; color:var(--ink-2)}
.pinfo dl{display:grid; grid-template-columns:auto 1fr; gap:5px 14px; margin:0; font-size:13.5px}
.pinfo dt{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--moss); padding-top:3px}
.pinfo dd{margin:0}

/* ==========================================================================
   one desktop threshold for the whole header. Folding the live chip into the
   Kontakt button freed ~150px, so six nav items, both switches and the CTA now
   fit side by side from 1260px (measured); below that the burger sheet carries
   all of it, and the CTA — with its live dot — stays in the bar regardless.
   ========================================================================== */
@media (max-width:1259px){
  .nav{display:none}
  .langsw{display:none}
  .themesw{display:none}
  .burger{display:grid}
  .hdr__cta{margin-left:auto}
}
@media (min-width:1260px){
  .nav{display:flex}
  .langsw{display:flex}
  .themesw{display:flex}
  .burger{display:none}
  .hdr__cta{margin-left:0}
}
/* the header bar may run wider than the 1280px reading measure — it holds more items */
@media (min-width:1260px){.hdr__in{max-width:1400px; gap:14px; padding-inline:40px}}

/* <picture> is a wrapper only; the layouts position the <img> itself */
picture{display:contents}
</style>
</head>
